[package]
name = "shamwari-gateway"
version = "0.1.5"
edition = "2021"
description = "The Shamwari edge gateway (api.shamwari.ai) on Cloudflare Workers, in Rust"
repository = "https://github.com/shamwari-ai/shamwari-gateway"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
# Joins the own-sites searches and the Ground search, as the TypeScript Promise.all does.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
# The Rule 1 rules (personal.rs) and the own-sites text handling, as the TypeScript regular expressions.
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
# NFKC (personal.rs) and NFKD (own_sites.rs), as the TypeScript String.prototype.normalize.
unicode-normalization = "0.1.26"
url = "2.5.9"

[dev-dependencies]
futures = { version = "0.3.34", features = ["executor"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
worker = "0.9.0"
wasm-bindgen-futures = "0.4.57"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }

# Release builds are what ships: size matters (the Worker upload limit) and
# panics are never recovered, so abort rather than carry unwinding tables.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
