name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "claude/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This repo is a scaffold until the code is extracted into it. The code jobs
  # below are skipped (not failed) while there is nothing to build or scan.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.find.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          if [ -f Cargo.toml ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
  # The gateway is Rust (workers-rs). These checks cover the two rules that
  # must not be broken as the TypeScript tests port with the code: personal
  # scope never resolves to a cloud destination, and only open-weight output
  # with explicit consent may train Mind.
  rust:
    name: Rust (fmt, clippy, test, wasm32 build)
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel, components and the wasm target.
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (host)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (wasm32)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test --locked
      # Runs wrangler.toml's [build] (scripts/build-worker.sh) and bundles the
      # Worker, uploading nothing and needing no credential.
      - name: Build the Worker as Cloudflare does (dry run)
        run: npx --yes wrangler@4.166.0 deploy --dry-run --outdir "${RUNNER_TEMP}/worker-dry-run"

  secrets:
    uses: shamwari-ai/.github/.github/workflows/reusable-gitleaks.yml@main

  # CodeQL runs from the repository's default setup (which detects Rust and
  # Actions itself); an advanced-configuration job here is refused while that
  # setup is on.
